name: Pipeline semanal

# Agendado: baixa os dados, roda o dbt, commita os marts e publica o site.
# Push na main mexendo no dashboard: só reconstrói e publica o site (com os marts já versionados).
on:
  schedule:
    # Toda segunda-feira às 09:00 UTC (06:00 em Brasília)
    - cron: "0 9 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "data/marts/**"
      - ".github/workflows/pipeline.yml"

# Nunca duas execuções ao mesmo tempo (as duas tentariam commitar e publicar)
concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dados:
    name: Ingestão e dbt
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # para commitar os marts
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip

      - name: Instala dependências
        run: pip install -r requirements.txt

      - name: Ingestão (ANEEL e IBGE)
        run: python -m ingestao

      - name: Instala pacotes do dbt
        working-directory: transform
        run: dbt deps

      - name: Verifica se a ANEEL atualizou os dados
        # Só alerta: dado velho não deve parar o pipeline nem o commit que mantém o agendamento ativo
        continue-on-error: true
        working-directory: transform
        run: dbt source freshness

      - name: dbt build (modelos e testes)
        working-directory: transform
        run: dbt build

      - name: Commita os marts
        run: bash scripts/commitar_marts.sh

  site:
    name: Build do site
    needs: dados
    # Roda depois do job de dados, ou sozinho quando ele é pulado (push na main)
    if: always() && (needs.dados.result == 'success' || needs.dados.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Pega o commit de marts que o job anterior acabou de fazer
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Instala dependências
        working-directory: dashboard
        run: npm ci

      - name: Carrega os marts
        working-directory: dashboard
        run: npm run sources:strict

      - name: Gera o site estático
        working-directory: dashboard
        run: npm run build:strict

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard/build

  publicar:
    name: Publica no GitHub Pages
    needs: site
    if: always() && needs.site.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
